<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>session recording test</title>

    <script>
      (function (d, a, s, h, z, e, r, o) {
        d[a] ||
          ((z = d[a] =
            function () {
              h.push(arguments);
            }),
          (z._t = new Date()),
          (z._v = 1),
          (h = z._q = []));
      })(window, "dash0");

      dash0("init", {
        serviceName: "dash0.com",
        serviceVersion: "1.2.3",
        environment: "prod",
        endpoint: {
          url: `http://${window.location.hostname}:8011?cors=true`,
          authToken: "auth_abc123",
          dataset: "production",
        },
        sessionRecording: {
          // Short chunk interval so the test does not wait for the 5s default.
          chunkMaxMillis: 500,
        },
      });

      function onStop() {
        dash0("stopSessionRecording");
      }
    </script>
    <script defer crossorigin="anonymous" src="/dist/dash0.iife.js"></script>
    <script defer crossorigin="anonymous" src="/dist/dash0-session-recording.iife.js"></script>
  </head>
  <body>
    <h1 id="visible-heading">Visible heading text</h1>
    <p class="dash0-mask" id="masked-paragraph">Masked paragraph text</p>
    <div class="dash0-block" id="blocked-div">Blocked element text</div>
    <input id="secret-input" type="text" />
    <button id="toggle" onclick="document.getElementById('visible-heading').textContent = 'Heading after click'">
      Toggle
    </button>
    <button onclick="onStop()">Stop Recording</button>
  </body>
</html>
