name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      capabilities: ${{ steps.get-capabilities.outputs.capabilities }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm run lint

      - name: prettier:check
        run: pnpm run prettier:check

      - name: test:unit
        run: pnpm run test:unit

      - name: build
        run: pnpm run build

      # E2E tests exercise runtime behavior, so a change that only touches docs (README.md, INSTALL.md,
      # docs/) can't affect their outcome. Detect that case via a plain git diff (no extra actions/deps needed)
      # and skip the E2E matrix by handing it an empty capability list; check-e2e-tests still passes since a
      # skipped test-e2e run isn't a 'failure' or 'cancelled' result.
      #
      # This must fail open: any error here (unreachable base, GC'd object, network blip) falls back to
      # only_docs=false rather than erroring the build job, since build gates every other job in this workflow.
      - name: Determine if only documentation changed
        id: docs-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # base is all-zeros on a new branch's first push (no prior commit to diff against); run the full
          # pipeline in that case rather than guessing.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "Could not fetch base $base, treating as non-docs-only"
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames: a rename into docs/ (e.g. `git mv src/foo.ts docs/foo.md`) would otherwise report
          # only the destination path and be misclassified as a docs-only change.
          if ! changed_files=$(git diff --no-renames --name-only "$base" "${{ github.sha }}"); then
            echo "git diff against base $base failed, treating as non-docs-only"
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          if [ -n "$changed_files" ] && ! echo "$changed_files" | grep -qvE '^(docs/|README\.md$|INSTALL\.md$)'; then
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get capabilities for E2E tests
        id: get-capabilities
        run: |
          if [ "${{ steps.docs-only.outputs.only_docs }}" = "true" ]; then
            echo "capabilities=[]" >> $GITHUB_OUTPUT
          else
            echo "capabilities=$(pnpm exec tsx ./test/e2e/scripts/get-wdio-capabilities.ts)" >> $GITHUB_OUTPUT
          fi

  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        capability: ${{ fromJson(needs.build.outputs.capabilities) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm run build

      - name: Run E2E test for ${{ matrix.capability }}
        run: pnpm run test:e2e
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          WDIO_SELECTED_CAPABILITIES: ${{ matrix.capability }}

  check-e2e-tests:
    name: Require Passing E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test-e2e
    # test-e2e is skipped (not 'success') when the E2E matrix is empty for a docs-only change; without
    # `always()` here, GitHub's default needs-cascade would skip this job too, so its own pass/fail logic
    # below (which does account for 'skipped') would never run.
    if: ${{ always() }}
    steps:
      - name: Successful tests
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Failing tests
        if: ${{ failure() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  release:
    needs: [build]
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        with:
          git-user-name: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        uses: JoshuaKGoldberg/release-it-action@8ee87d0d30f97b452ef5d8aa9f4d0490eed439aa #0.4.0

  # On every pull request, verify that the doc transformations in sync-docs/transformations.yaml still apply
  # cleanly (including the coverage check) before anything is merged. Dry-run mode stops after the transformation
  # step: no target repository is checked out, no PR is created, and no token is required.
  sync_docs_dry_run:
    name: Verify Web SDK docs sync (dry run)
    needs: [build]
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/sync-docs-to-website.yaml
    with:
      dry-run: true

  # After a release has been published on main, sync the Web SDK docs to the documentation on
  # https://www.dash0.com/docs. release-it runs on every push to main but only publishes when there are
  # releasable commits; gating on its success keeps the sync tied to the release job's outcome.
  sync_docs_to_website:
    name: Synchronize Web SDK docs to dash0.com/docs
    needs: [release]
    if: ${{ always() && needs.release.result == 'success' }}
    uses: ./.github/workflows/sync-docs-to-website.yaml
    secrets:
      DASH0_DOCS_REPO_GITHUB_PAT: ${{ secrets.DASH0_DOCS_REPO_GITHUB_PAT }}
      SYNC_DOCUMENTATION_TARGET_REPOSITORY: ${{ secrets.SYNC_DOCUMENTATION_TARGET_REPOSITORY }}
      SYNC_DOCUMENTATION_TARGET_DIRECTORY: ${{ secrets.SYNC_DOCUMENTATION_TARGET_DIRECTORY }}
