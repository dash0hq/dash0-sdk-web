# Transformations applied to INSTALL.md before copying to the Dash0 documentation repository
# (see .github/workflows/sync-docs-to-website.yaml).
#
# This file is the source of truth for how the Web SDK installation docs are adapted into the docs pages.
# Edit this file whenever the required modifications change.
#
# INSTALL.md is split into four documentation pages:
# - getting-started-website-monitoring.md (introduction and prerequisites, lines 1-22)
# - web-sdk-setup.md (installation and setup, lines 23-120)
# - web-sdk-configuration.md (configuration options, lines 121-543)
# - sdk-api-reference.md (API reference, lines 544+)
#
# Structure of this file:
#
# - common   A list of transformations applied to every synced file, in order, before the file-specific ones.
# - files    A list of file entries. Each entry has:
#              source           Path of the source file, relative to the repository root.
#              target           Path of the output file, relative to the target directory in the docs repository.
#              title            The `title` rendered into the page's frontmatter.
#              description      The `description` rendered into the page's frontmatter.
#              transformations  Optional list of transformations applied to this file only, after the common ones.
#
# A frontmatter block is generated from each entry's `title`/`description` (plus a `lastUpdated` timestamp) and
# prepended to the transformed file.
#
# The supported transformation types are:
#
# - prepend          Insert `content` at the very beginning of the document.
# - replace-regex    Replace matches of the Python regular expression `find` with `replace`.
#                    Optional `flags` is a list drawn from: multiline (^/$ match line boundaries),
#                    dotall (. matches newlines), ignorecase.
# - remove-line      Remove the whole line containing the literal marker `line`. If this leaves multiple
#                    consecutive empty lines behind, they are normalized to a single empty line.
#
# By default, every `replace-regex`/`remove-line` transformation must match at least once; if it does not, the
# workflow fails. This guards against the docs drifting away from this file and a modification silently becoming a
# no-op. Set `required: false` on an individual transformation to allow zero matches.
#
# The inserted/replacement text (the `content` of prepend and the `replace` of replace-regex) may contain
# placeholders, which are expanded when the transformations are applied. Currently the only supported placeholder is:
#
# - $timestamp   The current UTC date/time. A single value is computed per run, so all occurrences render identically.

common:
  - description: remove the leading top-level heading (the frontmatter title replaces it)
    type: replace-regex
    find: '\A#\s+[^\n]*\n'
    replace: ''

files:
  - source: INSTALL.md
    target: dash0/monitoring/websites/getting-started-website-monitoring.md
    title: Get Started with Website Monitoring
    description: Prerequisites and preparation for setting up the Dash0 Web SDK.
    transformations:
      - description: extract content before Setup section (lines 1-22)
        type: replace-regex
        find: '(?s)(.*?)^## Setup.*'
        replace: '\1'
        flags:
          - multiline
          - dotall

      - description: add auto-generated warning comment
        type: prepend
        content: |
          <!-- AUTO-GENERATED from dash0-sdk-web/INSTALL.md - Do not edit directly -->


      - description: add navigation to next steps
        type: prepend
        content: |
          Once you've completed the prerequisites, proceed to [Set Up the Web SDK](/docs/dash0/monitoring/websites/web-sdk-setup).


      - description: update GitHub issue link to support contact
        type: replace-regex
        find: '\[creating a GitHub issue\]\(https://github\.com/dash0hq/dash0-sdk-web/issues\)'
        replace: '[contacting support](https://www.dash0.com/support)'
        required: false

      - description: rewrite documentation.dash0.com links to internal paths
        type: replace-regex
        find: 'https://www\.dash0\.com/documentation/dash0/([^)]+)'
        replace: '/docs/dash0/\1'

  - source: INSTALL.md
    target: dash0/monitoring/websites/web-sdk-setup.md
    title: Set Up the Web SDK
    description: Install and initialize the Dash0 Web SDK for website monitoring.
    transformations:
      - description: extract Setup section only (lines 23-120)
        type: replace-regex
        find: '(?s).*?^## Setup\n(.*?)^## Configuration.*'
        replace: '\1'
        flags:
          - multiline
          - dotall

      - description: add auto-generated warning comment
        type: prepend
        content: |
          <!-- AUTO-GENERATED from dash0-sdk-web/INSTALL.md - Do not edit directly -->


      - description: add navigation links
        type: prepend
        content: |
          Before you begin, see [Get Started with Website Monitoring](/docs/dash0/monitoring/websites/getting-started-website-monitoring).

          After setup, learn about [Web SDK Configuration](/docs/dash0/monitoring/websites/web-sdk-configuration).


      - description: update GitHub issue link to support contact
        type: replace-regex
        find: '\[creating a GitHub issue\]\(https://github\.com/dash0hq/dash0-sdk-web/issues\)'
        replace: '[contacting support](https://www.dash0.com/support)'
        required: false

      - description: rewrite documentation.dash0.com links to internal paths
        type: replace-regex
        find: 'https://www\.dash0\.com/documentation/dash0/([^)]+)'
        replace: '/docs/dash0/\1'
        required: false

  - source: INSTALL.md
    target: dash0/monitoring/websites/web-sdk-configuration.md
    title: Web SDK Configuration
    description: Configure the Dash0 Web SDK with options for telemetry, instrumentations, and custom behavior.
    transformations:
      - description: extract Configuration section only (lines 121-543)
        type: replace-regex
        find: '(?s).*?^## Configuration\n(.*?)^## API.*'
        replace: '\1'
        flags:
          - multiline
          - dotall

      - description: add auto-generated warning comment
        type: prepend
        content: |
          <!-- AUTO-GENERATED from dash0-sdk-web/INSTALL.md - Do not edit directly -->


      - description: add navigation links
        type: prepend
        content: |
          This page covers configuration options for the Dash0 Web SDK.

          For installation instructions, see [Set Up the Web SDK](/docs/dash0/monitoring/websites/web-sdk-setup). For API methods, see [Web SDK API Reference](/docs/dash0/monitoring/websites/sdk-api-reference).


      - description: update GitHub issue link to support contact
        type: replace-regex
        find: '\[creating a GitHub issue\]\(https://github\.com/dash0hq/dash0-sdk-web/issues\)'
        replace: '[contacting support](https://www.dash0.com/support)'
        required: false

      - description: rewrite documentation.dash0.com links to internal paths
        type: replace-regex
        find: 'https://www\.dash0\.com/documentation/dash0/([^)]+)'
        replace: '/docs/dash0/\1'
        required: false

  - source: INSTALL.md
    target: dash0/monitoring/websites/sdk-api-reference.md
    title: Web SDK API Reference
    description: Complete API reference for the Dash0 Web SDK including methods and functions.
    transformations:
      - description: extract API section only (lines 544+)
        type: replace-regex
        find: '(?s).*?^## API\n(.*)'
        replace: '\1'
        flags:
          - multiline
          - dotall

      - description: add auto-generated warning comment
        type: prepend
        content: |
          <!-- AUTO-GENERATED from dash0-sdk-web/INSTALL.md - Do not edit directly -->


      - description: add introduction and navigation links
        type: prepend
        content: |
          This page provides a complete reference for the Dash0 Web SDK API methods and functions.

          For installation instructions, see [Set Up the Web SDK](/docs/dash0/monitoring/websites/web-sdk-setup). For configuration options, see [Web SDK Configuration](/docs/dash0/monitoring/websites/web-sdk-configuration).


      - description: rewrite documentation.dash0.com links to internal paths
        type: replace-regex
        find: 'https://www\.dash0\.com/documentation/dash0/([^)]+)'
        replace: '/docs/dash0/\1'
        required: false
