name: Synchronize Web SDK docs to dash0.com/docs

# Copies INSTALL.md from this repository into the Dash0 website documentation, applying the
# transformations declared in .github/workflows/sync-docs/transformations.yaml and opening (or
# updating) a pull request against the target repository.
#
# All engine and PR-flow logic lives in the shared action `dash0hq/sync-docs-action`; this workflow
# is only the caller shell.
#
# Prerequisites (repository secrets):
# - REPOSITORY_FULL_ACCESS_GITHUB_TOKEN — fine-grained PAT scoped to the target repository with
#   `Contents: Read and write` and `Pull requests: Read and write`. The secret name matches the
#   Dash0 org convention across other source-repo callers.

on:
  workflow_dispatch:
    inputs:
      target-repository:
        description: "Override the target repository (production default: dash0hq/dash0-website)."
        required: false
        default: dash0hq/dash0-website
  push:
    branches:
      - main
    paths:
      - "INSTALL.md"
      - ".github/workflows/sync-docs/**"
      - ".github/workflows/sync-docs-to-website.yaml"

jobs:
  sync-docs:
    name: Synchronize Web SDK docs with dash0.com/docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout dash0-sdk-web
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Sync docs
        uses: dash0hq/sync-docs-action@802854fea6967d26c38b52a41cda2a2ca94e8c4e # main @ 2026-07-08
        with:
          target-repository: ${{ inputs.target-repository || 'dash0hq/dash0-website' }}
          target-github-token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          pr-branch: sync-dash0-web-sdk-docs
          pr-title: "docs: synchronize Web SDK documentation"
          pr-body: |
            This PR synchronizes the content of the Web SDK documentation from
            [dash0hq/dash0-sdk-web](https://github.com/dash0hq/dash0-sdk-web) into the
            documentation on https://www.dash0.com/docs.
